<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Catálogo de constelaciones</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 0 12px; }
    input, select, button { padding: 6px; margin: 2px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    .error { color: red; }
  </style>
</head>
<body x-data="catalogo()" x-init="cargar()">
  <h1>Catálogo de constelaciones</h1>
  <p class="error" x-text="error"></p>

  <h2 x-text="form.id === null ? 'Nueva constelación' : 'Editar constelación #' + form.id"></h2>
  <form @submit.prevent="guardar()">
    <input placeholder="Nombre" required x-model="form.nombre">
    <select x-model="form.hemisferio">
      <option>Norte</option>
      <option>Sur</option>
      <option>Ambos</option>
    </select>
    <input placeholder="Estrella principal" required x-model="form.estrellaPrincipal">
    <input placeholder="Descubierto por" x-model="form.descubiertoPor">
    <button type="submit" x-text="form.id === null ? 'Crear' : 'Guardar'"></button>
    <button type="button" x-show="form.id !== null" @click="limpiar()">Cancelar</button>
  </form>

  <h2>Constelaciones</h2>
  <table>
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Hemisferio</th><th>Estrella principal</th><th>Descubierto por</th><th></th></tr>
    </thead>
    <tbody>
      <template x-for="c in items" :key="c.id">
        <tr>
          <td x-text="c.id"></td>
          <td x-text="c.nombre"></td>
          <td x-text="c.hemisferio"></td>
          <td x-text="c.estrellaPrincipal"></td>
          <td x-text="c.descubiertoPor || '-'"></td>
          <td>
            <button @click="editar(c)">Editar</button>
            <button @click="eliminar(c)">Eliminar</button>
          </td>
        </tr>
      </template>
    </tbody>
  </table>
  <p x-show="items.length === 0">No hay constelaciones.</p>

  <script>
    // Llama a una función de Code.gs y devuelve una promesa.
    function servidor(funcion, ...argumentos) {
      return new Promise((resolver, rechazar) => {
        google.script.run
          .withSuccessHandler(resolver)
          .withFailureHandler(e => rechazar(new Error(e.message)))
          [funcion](...argumentos);
      });
    }

    function catalogo() {
      return {
        items: [],
        form: { id: null, nombre: '', hemisferio: 'Norte', estrellaPrincipal: '', descubiertoPor: '' },
        error: '',

        // Ejecuta una función del servidor; si falla, muestra el error y devuelve undefined.
        async llamar(funcion, ...argumentos) {
          this.error = '';
          try {
            return await servidor(funcion, ...argumentos);
          } catch (e) {
            this.error = e.message;
          }
        },

        async cargar() {
          const lista = await this.llamar('listarConstelaciones');
          if (lista) this.items = lista;
        },

        async guardar() {
          const datos = {
            nombre: this.form.nombre,
            hemisferio: this.form.hemisferio,
            estrellaPrincipal: this.form.estrellaPrincipal,
            descubiertoPor: this.form.descubiertoPor
          };
          const id = this.form.id;
          const resultado = id === null
            ? await this.llamar('crearConstelacion', datos)
            : await this.llamar('actualizarConstelacion', id, datos);
          if (resultado) {
            this.limpiar();
            await this.cargar();
          }
        },

        editar(c) {
          this.form = { id: c.id, nombre: c.nombre, hemisferio: c.hemisferio, estrellaPrincipal: c.estrellaPrincipal, descubiertoPor: c.descubiertoPor || '' };
        },

        limpiar() {
          this.form = { id: null, nombre: '', hemisferio: 'Norte', estrellaPrincipal: '', descubiertoPor: '' };
        },

        async eliminar(c) {
          if (!confirm('¿Eliminar "' + c.nombre + '"?')) return;
          if (await this.llamar('eliminarConstelacion', c.id)) {
            if (this.form.id === c.id) this.limpiar();
            await this.cargar();
          }
        }
      };
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</body>
</html>
